<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Matemáticas en Capas</title>
<style>
:root{--blue:#245BFF;--green:#168344;--ink:#111214;--muted:#787F89;--paper:#FBFBFA;--green-soft:#ECF8F0;--line:#E3E6E9;--hover-delay:500ms}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
body{font-family:Georgia,"Times New Roman",serif}
.page{width:100%;padding:24px clamp(18px,3.5vw,64px) 36px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.brand{font-size:12px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:#6C7179}
.lang{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:#fff}
.lang button{border:0;background:transparent;color:#777D86;border-radius:999px;padding:8px 12px;font:650 12px/1 ui-sans-serif,system-ui,sans-serif;cursor:pointer}
.lang button.active{background:var(--ink);color:#fff}
.lang button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.formula-stage{width:100%;padding:clamp(48px,6vw,88px) 0 clamp(42px,5vw,72px);text-align:center}
.formula-label{color:var(--blue);font:700 10px/1.4 ui-sans-serif,system-ui,sans-serif;letter-spacing:.17em;text-transform:uppercase;margin-bottom:24px}
.equation{display:flex;justify-content:center;align-items:center;gap:clamp(20px,4vw,56px);color:var(--blue);font-size:clamp(25px,3.5vw,46px);line-height:1.4;white-space:nowrap}
.equation>math,.condition{flex:none}
.condition{display:flex;align-items:center;gap:clamp(20px,4vw,56px);font-size:.76em}
.condition::before{content:"";height:32px;width:1px;background:#D5DFFF}
math{font-family:"Times New Roman",Georgia,serif}
.equation math{color:var(--blue)}
.explanation{margin:0;padding:0;list-style:none;font-size:clamp(22px,2.3vw,32px);line-height:1.5;letter-spacing:-.023em}
.sentence{display:grid;grid-template-columns:40px minmax(0,2fr) minmax(0,1fr);gap:clamp(16px,2.5vw,36px);align-items:center;width:100%;min-height:124px;padding:26px 0;transition:background .18s ease}
.step-number{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#F0F2F3;color:var(--muted);font:600 12px/1 ui-sans-serif,system-ui,sans-serif;transition:.18s ease}
.sentence:hover .step-number,.sentence:focus-within .step-number{background:var(--green-soft);color:var(--green)}
.sentence-copy{min-width:0;color:var(--ink)}
.inline-formula{position:relative;min-width:0;width:100%;min-height:94px;display:grid;align-content:center;gap:10px;background:transparent;border:0;border-radius:10px;padding:12px 0;color:var(--green);text-align:right;cursor:pointer;font-family:inherit}
.formula-viewport{position:relative;display:grid;grid-template-columns:minmax(0,1fr);min-width:0;overflow-x:auto;padding:22px 2px;font-size:clamp(16px,2.05vw,29px);scrollbar-width:thin}
.formula-frame{grid-area:1/1;display:flex;justify-content:safe flex-end;align-items:center;min-width:0;width:100%;white-space:nowrap}
.formula-frame math{color:var(--green);flex-shrink:0}
.formula-from{visibility:hidden}
.inline-formula:hover,.inline-formula:focus-visible{background:var(--green-soft)}
.inline-formula:focus-visible{outline:2px solid var(--green);outline-offset:5px}
.inline-formula.playing .formula-frame{visibility:hidden}
.motion-layer{position:absolute;inset:0;pointer-events:none;color:var(--green)}
.motion-token{position:absolute;display:block;transform-origin:0 0;white-space:nowrap;line-height:1;will-change:transform,opacity}
.motion-token math{color:inherit}
.motion-bar{position:absolute;height:1px;background:currentColor;transform-origin:0 0;will-change:transform,opacity}
.expand{position:relative;cursor:help;border-bottom:1px solid #BFC5CC;transition:border-color .18s ease,background .18s ease;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.expand:hover,.expand:focus-visible{border-bottom-color:var(--blue);background:#EEF3FF}
.expand:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:2px}
.expand.waiting::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--blue);transform-origin:left center;animation:hoverProgress var(--hover-delay) linear forwards}
@keyframes hoverProgress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.expand.revealing{animation:revealGlow .3s ease}
@keyframes revealGlow{from{background:#E7EEFF}to{background:transparent}}
.expand[data-complete="true"]{border-bottom-color:transparent;cursor:text}
.footer{margin-top:24px;color:var(--muted);font:400 12px/1.7 ui-sans-serif,system-ui,sans-serif}
@media(max-width:700px){
  .page{padding:20px 18px 28px}
  .brand{font-size:10px;letter-spacing:.1em}
  .formula-stage{padding:48px 0 40px}
  .equation{font-size:clamp(23px,5vw,34px);gap:20px}
  .condition{gap:20px}
  .condition::before{height:24px}
  .explanation{font-size:clamp(17px,3vw,22px)}
  .sentence{grid-template-columns:24px minmax(0,2fr) minmax(0,1fr);gap:12px;min-height:112px;padding:22px 0}
  .step-number{width:24px;height:24px;font-size:10px}
  .formula-viewport{font-size:16px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.topbar{flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
.exercise-nav{display:flex;align-items:center;gap:8px}
.exercise-nav a,.exercise-nav button,.practice button,.support select{font:500 12px/1.4 ui-sans-serif,system-ui,sans-serif;color:var(--ink);border:1px solid var(--line);border-radius:7px;background:white;text-decoration:none;padding:9px 12px;cursor:pointer}
.exercise-nav a[aria-disabled="true"]{opacity:.3;pointer-events:none}
.exercise-nav a:focus-visible,.exercise-nav button:focus-visible,.practice button:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
.nav-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 6px}
.problem-menu{position:relative}
.problem-menu summary{list-style:none;cursor:pointer;font-size:12px;font-weight:600;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:#fff}
.problem-menu summary::-webkit-details-marker{display:none}
.problem-links{position:absolute;left:50%;transform:translateX(-50%);top:44px;width:310px;padding:7px;background:white;border:1px solid var(--line);box-shadow:0 12px 40px #17223A14;border-radius:12px;z-index:5}
.problem-links a{display:flex;justify-content:space-between;gap:16px;border:0;padding:13px 10px}
.problem-links a:hover,.problem-links a[aria-current="page"]{background:#F0F4FF;color:var(--blue)}
.problem-links small{color:#A96320}
.exercise-meta{display:flex;align-items:center;gap:8px;margin:24px 0 0;font:500 11px/1.4 ui-sans-serif,system-ui,sans-serif}
.tag{border:1px solid var(--line);border-radius:5px;padding:4px 8px;color:#68717D;background:white}
.difficulty{color:#9C6A11;background:#FFF5DB;border-color:#F5E8BB}
.difficulty.hard{color:#B64B49;background:#FFF0EE;border-color:#F2D8D4}
.problem-name{margin-left:auto;color:var(--muted)}
.formula-stage{padding:40px 0 38px}
.study-tools{display:flex;align-items:start;justify-content:space-between;gap:24px;margin:0 0 24px;font-family:ui-sans-serif,system-ui,sans-serif}
.practice{max-width:720px;flex:1;border-left:2px solid #DCE5FF;padding:8px 16px;font-size:13px;color:#657083}
.practice h2{margin:0;color:var(--ink);font:600 13px/1.5 ui-sans-serif,system-ui,sans-serif}
#solution[hidden]{display:none}
#solution.revealed{animation:solutionReveal .28s ease-out}
@keyframes solutionReveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.practice-body{padding:12px 0 2px}
.practice-question{margin:0 0 12px;color:var(--ink);line-height:1.6}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.practice button:hover{border-color:var(--blue)}
.practice button[aria-pressed="true"]{border-color:var(--blue);background:#EEF3FF}
.practice-feedback{line-height:1.7;margin:12px 0 0;color:#526078}
.practice-feedback:empty{display:none}
.support{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap;padding-top:6px}
.support select{font-size:11px;padding:7px 8px}
.reflex{margin-top:12px;font:400 12px/1.7 ui-sans-serif,system-ui,sans-serif;letter-spacing:0;color:#687382;max-width:620px}
.reflex summary{display:inline;cursor:pointer;font-weight:500;color:#687382;border-bottom:1px dashed #CBD0D7}
.reflex p{margin:8px 0 0}
.reflex strong{font-weight:600;color:#414D5C}
.exercise-domain{text-align:center;font:400 11px/1.6 ui-sans-serif,system-ui,sans-serif;color:var(--muted);margin:20px 0 0}
@media(min-width:701px){.sentence{grid-template-columns:minmax(0,2fr) minmax(0,1fr);column-gap:28px}.sentence-copy{position:relative;padding-left:56px}.step-number{position:absolute;left:0;top:7px}}
@media(max-width:700px){
 .topbar{gap:16px}.exercise-nav{order:3;width:100%;justify-content:center}.problem-menu{flex:1;text-align:center}.problem-links{max-width:calc(100vw - 36px)}
 .exercise-meta{flex-wrap:wrap}.problem-name{margin-left:0;width:100%;margin-top:4px}
 .study-tools{flex-direction:column;gap:12px}.support{align-self:flex-end}.practice{width:100%}
 .sentence{grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}.sentence-copy{position:relative;padding-left:30px}.step-number{position:absolute;left:0;top:2px}
 .formula-viewport{font-size:16px}.reflex{font-size:11px}.equation{overflow-x:auto;justify-content:safe center}
}


</style>
</head>
<body>
<main class="page">
  <header class="topbar">
    <div class="brand">Matemáticas en Capas</div>
    <nav class="exercise-nav" aria-label="Exercise navigation">
      <a id="prevExercise" aria-label="Previous exercise">‹</a>
      <details class="problem-menu" id="problemMenu">
        <summary id="problemListLabel">☷ &nbsp; Problem list</summary>
        <div class="problem-links" id="problemLinks"></div>
      </details>
      <span class="nav-count" id="navCount">1 / 3</span>
      <a id="nextExercise" aria-label="Next exercise">›</a>
    </nav>
    <div class="lang"><button id="enBtn" class="active">EN</button><button id="esBtn">ES</button></div>
  </header>
  <div class="exercise-meta"><span class="tag" id="topicTag">Antiderivatives</span><span class="tag difficulty" id="difficultyTag">Medium</span></div>
  <div class="formula-stage">
    <div id="originalPanel">
      <div class="equation" id="originalEquation"></div>
    </div>
  </div>
  <div class="study-tools">
    <section class="practice" id="practice" aria-labelledby="practiceLabel">
      <h2 id="practiceLabel">Choose the first move</h2>
      <div class="practice-body"><p class="practice-question" id="practiceQuestion"></p><div class="choices" id="choices"></div><p class="practice-feedback" id="practiceFeedback" aria-live="polite"></p></div>
    </section>
  </div>
  <section id="solution" hidden>
  <ol class="explanation" id="explanation" aria-label="Solution steps"></ol>
  <p class="exercise-domain" id="exerciseDomain"></p>
  </section>
</main>

<script src="equation-motion.js"></script>
<script>
/*
  LOCAL AI PROXY
  OpenAI-compatible endpoint by default:
  http://localhost:8787/v1/chat/completions

  Override without editing the file:
  ?proxy=http://localhost:YOUR_PORT/v1/chat/completions
*/
const configuredProxy = new URLSearchParams(location.search).get("proxy");
const isLocalPreview = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
const proxyEndpoint = configuredProxy || (isLocalPreview ? "http://localhost:8787/v1/chat/completions" : null);

const UI = {
  en:{
    originalLabel:"Original equation",
    stepLabel:"Solution so far",
    footer:"The green derivation is always visible. Hover over an underlined phrase for half a second to expand only that explanation.",
    starts:{separate:"First, we ",integrate:"Then we ",solve:"Next we ",initial:"After that, we ",result:"This gives "},
    fallback:{
      separate:["separate the variables","separate the variables, placing every y-dependent factor on the left and every x-dependent factor on the right","separate the variables to obtain dy/(1+y²) = [x/(1+x²)] dx","separate the variables by dividing by 1+y² and multiplying by dx, so each side depends on only one variable: dy/(1+y²) = [x/(1+x²)] dx"],
      integrate:["integrate both sides","integrate both sides using the standard antiderivatives of 1/(1+y²) and x/(1+x²)","integrate to obtain arctan(y) = ½ ln(1+x²) + C","integrate carefully: ∫dy/(1+y²)=arctan(y), while ∫x/(1+x²)dx = ½ln(1+x²), because d(1+x²)/dx = 2x"],
      solve:["solve explicitly for y","solve explicitly for y by applying the tangent function to both sides","apply tangent to obtain y = tan(½ ln(1+x²) + C)","apply tangent because tan and arctan are inverse functions on the relevant branch, giving y = tan(½ ln(1+x²) + C)"],
      initial:["use the initial condition","use y(0)=1 to determine the integration constant","substitute x=0 and y=1, which gives C = π/4","substitute the initial condition into arctan(y)=½ln(1+x²)+C: arctan(1)=π/4 and ln(1)=0, so C=π/4"],
      result:["the final solution","the final solution y(x) = tan(½ ln(1+x²) + π/4)","the final solution y(x) = tan(½ ln(1+x²) + π/4), which satisfies y(0)=1","the final solution y(x) = tan(½ ln(1+x²) + π/4); differentiating it gives x(1+y²)/(1+x²), so it satisfies both the differential equation and the initial condition"]
    }
  },
  es:{
    originalLabel:"Ecuación original",
    stepLabel:"Solución hasta este paso",
    footer:"La derivación en verde siempre está visible. Mantén el cursor medio segundo sobre una frase subrayada para ampliar solo esa explicación.",
    starts:{separate:"Empezamos por ",integrate:"Después vamos a ",solve:"A continuación vamos a ",initial:"Luego vamos a ",result:"Esto nos da "},
    fallback:{
      separate:["separar las variables","separar las variables, colocando todos los factores que dependen de y a la izquierda y los que dependen de x a la derecha","separar las variables para obtener dy/(1+y²) = [x/(1+x²)] dx","separar las variables dividiendo por 1+y² y multiplicando por dx, de modo que cada lado dependa de una sola variable: dy/(1+y²) = [x/(1+x²)] dx"],
      integrate:["integrar ambos lados","integrar ambos lados usando las primitivas conocidas de 1/(1+y²) y x/(1+x²)","integrar para obtener arctan(y) = ½ ln(1+x²) + C","integrar con cuidado: ∫dy/(1+y²)=arctan(y), mientras que ∫x/(1+x²)dx = ½ln(1+x²), porque d(1+x²)/dx = 2x"],
      solve:["despejar y","despejar y aplicando la función tangente a ambos lados","aplicar la tangente para obtener y = tan(½ ln(1+x²) + C)","aplicar la tangente porque tan y arctan son funciones inversas en la rama correspondiente, obteniendo y = tan(½ ln(1+x²) + C)"],
      initial:["usar la condición inicial","usar y(0)=1 para determinar la constante de integración","sustituir x=0 e y=1, lo que da C = π/4","sustituir la condición inicial en arctan(y)=½ln(1+x²)+C: arctan(1)=π/4 y ln(1)=0, por lo que C=π/4"],
      result:["la solución final","la solución final y(x) = tan(½ ln(1+x²) + π/4)","la solución final y(x) = tan(½ ln(1+x²) + π/4), que satisface y(0)=1","la solución final y(x) = tan(½ ln(1+x²) + π/4); al derivarla se obtiene x(1+y²)/(1+x²), por lo que satisface tanto la ecuación diferencial como la condición inicial"]
    }
  }
};

const order = ["separate","integrate","solve","initial","result"];

const HOVER_DELAY = 500;
document.documentElement.style.setProperty("--hover-delay", `${HOVER_DELAY}ms`);

const stepFormulas = {
  separate: `<math>
    <mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mn>1</mn><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup></mrow></mfrac>
    <mo>=</mo>
    <mfrac><mrow><mi>x</mi><mi>d</mi><mi>x</mi></mrow><mrow><mn>1</mn><mo>+</mo><msup><mi>x</mi><mn>2</mn></msup></mrow></mfrac>
  </math>`,
  integrate: `<math>
    <mi>arctan</mi><mo>(</mo><mi>y</mi><mo>)</mo>
    <mo>=</mo>
    <mfrac><mn>1</mn><mn>2</mn></mfrac>
    <mi>ln</mi><mo>(</mo><mn>1</mn><mo>+</mo><msup><mi>x</mi><mn>2</mn></msup><mo>)</mo>
    <mo>+</mo><mi>C</mi>
  </math>`,
  solve: `<math>
    <mi>y</mi><mo>=</mo>
    <mi>tan</mi><mo>(</mo>
    <mfrac><mn>1</mn><mn>2</mn></mfrac>
    <mi>ln</mi><mo>(</mo><mn>1</mn><mo>+</mo><msup><mi>x</mi><mn>2</mn></msup><mo>)</mo>
    <mo>+</mo><mi>C</mi><mo>)</mo>
  </math>`,
  initial: `<math>
    <mi>C</mi><mo>=</mo><mfrac><mi>π</mi><mn>4</mn></mfrac>
  </math>`,
  result: `<math>
    <mi>y</mi><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo>
    <mi>tan</mi><mo>(</mo>
    <mfrac><mn>1</mn><mn>2</mn></mfrac>
    <mi>ln</mi><mo>(</mo><mn>1</mn><mo>+</mo><msup><mi>x</mi><mn>2</mn></msup><mo>)</mo>
    <mo>+</mo><mfrac><mi>π</mi><mn>4</mn></mfrac><mo>)</mo>
  </math>`
};

/* EXERCISES: all steps and hints work offline. The optional local proxy can elaborate them. */
const originalMath = `<math><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>x</mi><mo>(</mo><mn>1</mn><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>)</mo></mrow><mrow><mn>1</mn><mo>+</mo><msup><mi>x</mi><mn>2</mn></msup></mrow></mfrac></math>`;
const initialMath = `<div class="condition"><math><mi>y</mi><mo>(</mo><mn>0</mn><mo>)</mo><mo>=</mo><mn>1</mn></math></div>`;
const pair = (en,es)=>({en,es});
// Small MathML helpers keep the new exercises dependency-free and accessible.
const frac=(a,b)=>`<mfrac><mrow>${a}</mrow><mrow>${b}</mrow></mfrac>`;
const pow=(a,b)=>`<msup><mrow>${a}</mrow><mrow>${b}</mrow></msup>`;
const x='<mi>x</mi>', e='<mi>e</mi>', dx='<mi>d</mi><mi>x</mi>', C='<mi>C</mi>';
const n=v=>`<mn>${v}</mn>`, op=v=>`<mo>${v}</mo>`, name=v=>`<mi>${v}</mi>`;
const eq=op('='), plus=op('+'), minus=op('−'), xp=pow(x,n(2)), ex=pow(e,x);
const wrap=v=>`<math><mrow>${v}</mrow></math>`;
const integral=v=>op('∫')+v+dx;
const par=v=>op('(')+v+op(')');
const logabs=v=>name('ln')+op('|')+v+op('|');
const hardParts = [
 wrap(name('u')+eq+xp+op(',')+name('dv')+eq+ex+dx),
 wrap(name('I')+eq+xp+ex+minus+n(2)+integral(x+ex)),
 wrap(integral(x+ex)+eq+x+ex+minus+ex),
 wrap(name('I')+eq+xp+ex+minus+n(2)+par(x+ex+minus+ex)),
 wrap(name('I')+eq+ex+par(xp+minus+n(2)+x+plus+n(2))+plus+C)
];
const Q=xp+plus+n(1), xm=x+minus+n(1), Q2=pow(par(Q),n(2)), xm2=pow(par(xm),n(2));
const numerator=n(3)+pow(x,n(5))+minus+n(2)+pow(x,n(4))+plus+n(6)+pow(x,n(3))+minus+xp+minus+n(3)+x+plus+n(5);
const rational=frac(numerator,xm2+Q2);
const q=name('Q'), q2=pow(q,n(2)), N=name('N');
const sumTerms=frac(n(1),xm)+plus+frac(n(2),xm2)+plus+frac(n(2)+x+plus+n(1),q)+plus+frac(n(2)+x+plus+n(3),q2);
const hardFractions=[
 wrap(q+eq+Q+op(',')+N+eq+numerator),
 wrap(frac(N,xm2+q2)+eq+frac(name('A'),xm)+plus+frac(name('B'),xm2)+plus+frac(name('C')+x+plus+name('D'),q)+plus+frac(name('E')+x+plus+name('F'),q2)),
 wrap(N+eq+name('A')+par(xm)+q2+plus+name('B')+q2+plus+par(name('C')+x+plus+name('D'))+xm2+q+plus+par(name('E')+x+plus+name('F'))+xm2),
 wrap(n(8)+eq+n(4)+name('B')+op('⇒')+name('B')+eq+n(2)),
 wrap(n(20)+eq+n(4)+name('A')+plus+n(8)+name('B')+op('⇒')+name('A')+eq+n(1)),
 wrap(name('A')+plus+name('C')+eq+n(3)+op(',')+minus+name('A')+plus+name('B')+minus+n(2)+name('C')+plus+name('D')+eq+minus+n(2)),
 wrap(name('C')+eq+n(2)+op(',')+name('D')+eq+n(1)+op(',')+name('E')+eq+n(2)+op(',')+name('F')+eq+n(3)),
 wrap(frac(N,xm2+q2)+eq+sumTerms),
 wrap(integral(par(frac(n(1),xm)+plus+frac(n(2),xm2)))+eq+logabs(xm)+minus+frac(n(2),xm)),
 wrap(integral(frac(n(2)+x+plus+n(1),q))+eq+name('ln')+q+plus+name('arctan')+x),
 wrap(integral(frac(n(2)+x+plus+n(3),q2))+eq+frac(n(3)+x+minus+n(2),n(2)+q)+plus+frac(n(3),n(2))+name('arctan')+x),
 wrap(name('I')+eq+logabs(xm)+plus+name('ln')+par(Q)+minus+frac(n(2),xm)+plus+frac(n(3)+x+minus+n(2),n(2)+par(Q))+plus+frac(n(5),n(2))+name('arctan')+x+plus+name('K'))
];

 {"en": "Choosing a root after clearing denominators isolates a coefficient without expanding the whole identity.", "es": "Elegir una raíz después de eliminar denominadores permite aislar un coeficiente sin desarrollar toda la identidad."}, "operation": {"en": "Evaluate at the repeated root to find B.", "es": "Evaluamos en la raíz repetida para hallar B."}}, {"text": {"en": "Differentiate the identity to uncover A.", "es": "Derivamos la identidad para descubrir A."}, "details": {"en": ["Differentiate both sides, then set x = 1. Since N′(1) = 20 and (Q²)′(1) = 8, we get 20 = 4A + 8B. With B = 2, A = 1.", "Terms containing (x − 1)² still vanish after one derivative at x = 1. The term A(x − 1)Q² now contributes 4A. This is the useful reflex for a repeated root."], "es": ["Derivamos ambos lados y luego ponemos x = 1. Como N′(1) = 20 y (Q²)′(1) = 8, obtenemos 20 = 4A + 8B. Con B = 2, A = 1.", "Los términos con (x − 1)² siguen anulándose tras una derivada en x = 1. El término A(x − 1)Q² aporta ahora 4A. Este es el recurso útil para una raíz repetida."]}, "hint": {"en": "Terms containing (x − 1)² still vanish after one derivative at x = 1. The term A(x − 1)Q² now contributes 4A. This is the useful reflex for a repeated root.", "es": "Los términos con (x − 1)² siguen anulándose tras una derivada en x = 1. El término A(x − 1)Q² aporta ahora 4A. Este es el recurso útil para una raíz repetida."}, "operation": {"en": "Differentiate the identity to uncover A.", "es": "Derivamos la identidad para descubrir A."}}, {"text": {"en": "Compare the two highest powers to find C and D.", "es": "Comparamos las dos potencias mayores para hallar C y D."}, "details": {"en": ["The x⁵ coefficient gives A + C = 3, so C = 2. The x⁴ coefficient gives −A + B − 2C + D = −2, so D = 1.", "Compare only the powers you need. Since A and B are known, these equations each introduce just one new unknown."], "es": ["El coeficiente de x⁵ da A + C = 3, así que C = 2. El de x⁴ da −A + B − 2C + D = −2, así que D = 1.", "Compara solo las potencias necesarias. Como A y B ya son conocidos, cada ecuación introduce una única incógnita nueva."]}, "hint": {"en": "Compare only the powers you need. Since A and B are known, these equations each introduce just one new unknown.", "es": "Compara solo las potencias necesarias. Como A y B ya son conocidos, cada ecuación introduce una única incógnita nueva."}, "operation": {"en": "Compare the two highest powers to find C and D.", "es": "Comparamos las dos potencias mayores para hallar C y D."}}, {"text": {"en": "Use the constant and cubic terms to finish the coefficients.", "es": "Usamos los términos constante y cúbico para completar los coeficientes."}, "details": {"en": ["At x = 0, −A + B + D + F = 5 gives F = 3. The x³ coefficient is 2A + 2C − 2D + E = 6, giving E = 2.", "The remaining checks are x²: −2A + 2B − 2C + 2D − 2E + F = −1, and x: A + C − 2D + E − 2F = −3. Both hold."], "es": ["En x = 0, −A + B + D + F = 5 da F = 3. El coeficiente de x³ es 2A + 2C − 2D + E = 6, por lo que E = 2.", "Las comprobaciones restantes son x²: −2A + 2B − 2C + 2D − 2E + F = −1, y x: A + C − 2D + E − 2F = −3. Ambas se cumplen."]}, "hint": {"en": "The remaining checks are x²: −2A + 2B − 2C + 2D − 2E + F = −1, and x: A + C − 2D + E − 2F = −3. Both hold.", "es": "Las comprobaciones restantes son x²: −2A + 2B − 2C + 2D − 2E + F = −1, y x: A + C − 2D + E − 2F = −3. Ambas se cumplen."}, "operation": {"en": "Use the constant and cubic terms to finish the coefficients.", "es": "Usamos los términos constante y cúbico para completar los coeficientes."}}, {"text": {"en": "Substitute all six coefficients and split the integral.", "es": "Sustituimos los seis coeficientes y separamos la integral."}, "details": {"en": ["The integrand becomes 1/(x − 1) + 2/(x − 1)² + (2x + 1)/Q + (2x + 3)/Q². Integrate these three groups separately.", "The algebra is finished. Now identify the integration pattern in each group: logarithm and power rule, quadratic derivative, then a repeated quadratic."], "es": ["El integrando se convierte en 1/(x − 1) + 2/(x − 1)² + (2x + 1)/Q + (2x + 3)/Q². Integramos estos tres grupos por separado.", "El álgebra está terminada. Identifica ahora el patrón de cada grupo: logaritmo y regla de potencias, derivada del cuadrático y cuadrático repetido."]}, "hint": {"en": "The algebra is finished. Now identify the integration pattern in each group: logarithm and power rule, quadratic derivative, then a repeated quadratic.", "es": "El álgebra está terminada. Identifica ahora el patrón de cada grupo: logaritmo y regla de potencias, derivada del cuadrático y cuadrático repetido."}, "operation": {"en": "Substitute all six coefficients and split the integral.", "es": "Sustituimos los seis coeficientes y separamos la integral."}}, {"text": {"en": "Integrate the linear-factor terms.", "es": "Integramos los términos de los factores lineales."}, "details": {"en": ["The first term gives ln|x − 1|. Rewrite the second as 2(x − 1)⁻²; its antiderivative is −2/(x − 1).", "Only power −1 produces a logarithm. For power −2 use the power rule, and retain the negative sign. Collect constants at the end."], "es": ["El primer término da ln|x − 1|. Reescribimos el segundo como 2(x − 1)⁻²; su primitiva es −2/(x − 1).", "Solo la potencia −1 produce un logaritmo. Para la potencia −2 usa la regla de potencias y conserva el signo menos. Agrupa las constantes al final."]}, "hint": {"en": "Only power −1 produces a logarithm. For power −2 use the power rule, and retain the negative sign. Collect constants at the end.", "es": "Solo la potencia −1 produce un logaritmo. Para la potencia −2 usa la regla de potencias y conserva el signo menos. Agrupa las constantes al final."}, "operation": {"en": "Integrate the linear-factor terms.", "es": "Integramos los términos de los factores lineales."}}, {"text": {"en": "Split the simple quadratic term into two familiar patterns.", "es": "Separamos el término cuadrático simple en dos patrones conocidos."}, "details": {"en": ["Split (2x + 1)/Q into 2x/Q + 1/Q. Because Q′ = 2x, these integrate to ln Q and arctan x.", "Q = x² + 1 is always positive, so ln Q needs no absolute value. A numerator containing the derivative of the denominator suggests substitution."], "es": ["Separamos (2x + 1)/Q en 2x/Q + 1/Q. Como Q′ = 2x, sus primitivas son ln Q y arctan x.", "Q = x² + 1 siempre es positivo, así que ln Q no necesita valor absoluto. Un numerador con la derivada del denominador sugiere sustitución."]}, "hint": {"en": "Q = x² + 1 is always positive, so ln Q needs no absolute value. A numerator containing the derivative of the denominator suggests substitution.", "es": "Q = x² + 1 siempre es positivo, así que ln Q no necesita valor absoluto. Un numerador con la derivada del denominador sugiere sustitución."}, "operation": {"en": "Split the simple quadratic term into two familiar patterns.", "es": "Separamos el término cuadrático simple en dos patrones conocidos."}}, {"text": {"en": "Reduce the repeated quadratic using a derivative identity.", "es": "Reducimos el cuadrático repetido mediante una identidad de derivadas."}, "details": {"en": ["Integrate 2x/Q² by u = Q to get −1/Q. Since (x/Q)′ = (1 − x²)/Q², we have 1/Q² = ½[(x/Q)′ + 1/Q]. Thus ∫3/Q² dx = 3x/(2Q) + 3 arctan(x)/2.", "Combine −1/Q + 3x/(2Q) into (3x − 2)/(2Q). This reduction avoids treating the repeated quadratic as if it were a simple arctangent."], "es": ["Integramos 2x/Q² con u = Q y obtenemos −1/Q. Como (x/Q)′ = (1 − x²)/Q², tenemos 1/Q² = ½[(x/Q)′ + 1/Q]. Así, ∫3/Q² dx = 3x/(2Q) + 3 arctan(x)/2.", "Combinamos −1/Q + 3x/(2Q) en (3x − 2)/(2Q). Esta reducción evita tratar el cuadrático repetido como una arcotangente simple."]}, "hint": {"en": "Combine −1/Q + 3x/(2Q) into (3x − 2)/(2Q). This reduction avoids treating the repeated quadratic as if it were a simple arctangent.", "es": "Combinamos −1/Q + 3x/(2Q) en (3x − 2)/(2Q). Esta reducción evita tratar el cuadrático repetido como una arcotangente simple."}, "operation": {"en": "Reduce the repeated quadratic using a derivative identity.", "es": "Reducimos el cuadrático repetido mediante una identidad de derivadas."}}, {"text": {"en": "Assemble the antiderivative and verify it.", "es": "Reunimos la primitiva y la verificamos."}, "details": {"en": ["Add the three groups, replace Q by x² + 1, and combine arctan coefficients: 1 + 3/2 = 5/2. Use K for the integration constant to distinguish it from coefficient C.", "Differentiate the result: the last rational and arctangent terms recover the two quadratic fractions, and the linear terms recover 1/(x − 1) + 2/(x − 1)². Recombining gives the original integrand."], "es": ["Sumamos los tres grupos, sustituimos Q por x² + 1 y combinamos los coeficientes de arctan: 1 + 3/2 = 5/2. Usamos K como constante de integración para distinguirla del coeficiente C.", "Derivamos el resultado: los últimos términos racionales y de arcotangente recuperan las dos fracciones cuadráticas, y los términos lineales recuperan 1/(x − 1) + 2/(x − 1)². Al reunirlos obtenemos el integrando original."]}, "hint": {"en": "Differentiate the result: the last rational and arctangent terms recover the two quadratic fractions, and the linear terms recover 1/(x − 1) + 2/(x − 1)². Recombining gives the original integrand.", "es": "Derivamos el resultado: los últimos términos racionales y de arcotangente recuperan las dos fracciones cuadráticas, y los términos lineales recuperan 1/(x − 1) + 2/(x − 1)². Al reunirlos obtenemos el integrando original."}, "operation": {"en": "Assemble the antiderivative and verify it.", "es": "Reunimos la primitiva y la verificamos."}}].map((step,i)=>({...step,formula:hardFractions[i]})),

 if(cache.has(key))return cache.get(key);
 try{
  const response=await fetch(proxyEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},signal:AbortSignal.timeout(4000),body:JSON.stringify({model:'local',temperature:0.2,messages:[{role:'system',content:`You are a concise calculus tutor. Answer only in ${language==='es'?'Spanish':'English'}. Return one short explanation, no markdown. Preserve the mathematical claims supplied.`},{role:'user',content:`Exercise: ${exercise.title[language]}. Current step: ${step.text[language]}. Explain this detail at depth ${level}: ${fallback}. Pattern to notice: ${step.hint[language]}.`} ]})});
  if(!response.ok)throw new Error('Proxy unavailable');
  const data=await response.json();
  const text=data?.choices?.[0]?.message?.content;
  if(typeof text!=='string'||!text.trim())throw new Error('Empty response');
  cache.set(key,text.trim());return text.trim();
 }catch{return fallback;}
}
async function deepen(el,index){
 const exercise=currentExercise(), step=exercise.steps[index], language=lang;
 if(!el.isConnected||levels[index]>=step.details[language].length)return;
 const next=++levels[index];
 el.classList.remove('waiting');
 el.textContent=step.details[language][next-1];
 el.classList.add('revealing');
 el.dataset.complete=String(next===step.details[language].length);
 setTimeout(()=>el.classList.remove('revealing'),300);
 const text=await getText(exercise,index,next,language);
 if(el.isConnected&&currentExercise()===exercise&&lang===language&&levels[index]===next)el.textContent=text;
}
function addInteractions(el,index){
 let timer;
 const cancel=()=>{clearTimeout(timer);el.classList.remove('waiting')};
 el.addEventListener('mouseenter',()=>{
  cancel();
  if(levels[index]>=currentExercise().steps[index].details[lang].length)return;
  el.classList.add('waiting');timer=setTimeout(()=>deepen(el,index),HOVER_DELAY);
 });
 el.addEventListener('mouseleave',cancel);
 el.addEventListener('blur',cancel);
 el.addEventListener('click',()=>{cancel();deepen(el,index)});
 el.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();cancel();deepen(el,index)}});
}
const answers=new Map();
let replayCleanups=[];
function render(){
 replayCleanups.forEach(cleanup=>cleanup());replayCleanups=[];
 const exercise=currentExercise(),l=labels[lang];
 levels=exercise.steps.map(()=>0);
 document.documentElement.lang=lang;
 document.title=`${t(exercise.title)} · Matemáticas en Capas`;
 document.getElementById('enBtn').classList.toggle('active',lang==='en');
 document.getElementById('esBtn').classList.toggle('active',lang==='es');
 document.getElementById('enBtn').setAttribute('aria-pressed',String(lang==='en'));
 document.getElementById('esBtn').setAttribute('aria-pressed',String(lang==='es'));
 document.getElementById('problemListLabel').textContent=l.list;
 document.getElementById('navCount').textContent=`${activeIndex+1} / ${exercises.length}`;
 const links=document.getElementById('problemLinks');links.replaceChildren();
 exercises.forEach((item,index)=>{
  const a=document.createElement('a');a.href=exerciseURL(index);
  const title=document.createElement('span');title.textContent=`${index+1}. ${t(item.title)}`;
  const difficulty=document.createElement('small');difficulty.textContent=l[item.difficulty];a.append(title,difficulty);
  if(index===activeIndex)a.setAttribute('aria-current','page');
  a.addEventListener('click',event=>{if(event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;event.preventDefault();navigate(index)});links.append(a);
 });
 for(const [id,index] of [['prevExercise',activeIndex-1],['nextExercise',activeIndex+1]]){
  const a=document.getElementById(id),valid=index>=0&&index<exercises.length;
  a.setAttribute('aria-disabled',String(!valid));a.tabIndex=valid?0:-1;
  a.setAttribute('aria-label',id==='prevExercise'?(lang==='es'?'Ejercicio anterior':'Previous exercise'):(lang==='es'?'Ejercicio siguiente':'Next exercise'));
  if(valid)a.href=exerciseURL(index);else a.removeAttribute('href');
  a.onclick=event=>{if(event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;event.preventDefault();if(valid)navigate(index)};
 }
 document.getElementById('topicTag').textContent=l.topic;
 const difficulty=document.getElementById('difficultyTag');difficulty.textContent=l[exercise.difficulty];difficulty.classList.toggle('hard',exercise.difficulty==='Hard');
 document.getElementById('originalEquation').innerHTML=exercise.original+exercise.condition;
 document.getElementById('practiceLabel').textContent=l.practice;
 document.getElementById('practiceQuestion').textContent=t(exercise.question);
 const selectedAnswer=answers.get(exercise.id);
 const solution=document.getElementById('solution');
 solution.classList.remove('revealed');
 solution.hidden=selectedAnswer===undefined;
 document.getElementById('practiceFeedback').textContent=selectedAnswer===undefined?'':t(exercise.feedback)[selectedAnswer];
 const choices=document.getElementById('choices');choices.replaceChildren();
 t(exercise.choices).forEach((choice,index)=>{
  const button=document.createElement('button');button.type='button';button.textContent=choice;button.setAttribute('aria-pressed',String(selectedAnswer===index));button.setAttribute('aria-controls','solution');
  button.addEventListener('click',()=>{
   choices.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
   answers.set(exercise.id,index);
   document.getElementById('practiceFeedback').textContent=t(exercise.feedback)[index];
   if(solution.hidden){solution.hidden=false;solution.classList.add('revealed')}
  });choices.append(button);
 });
 const root=document.getElementById('explanation');root.replaceChildren();root.setAttribute('aria-label',lang==='es'?'Pasos de la solución':'Solution steps');
 exercise.steps.forEach((step,index)=>{
  const row=document.createElement('li');row.className='sentence';
  const copy=document.createElement('div');copy.className='sentence-copy';
  const number=document.createElement('span');number.className='step-number';number.textContent=index+1;number.setAttribute('aria-hidden','true');
  const exp=document.createElement('span');exp.className='expand';exp.tabIndex=0;exp.setAttribute('role','button');exp.setAttribute('aria-description',lang==='es'?'Pulsa para mostrar más detalles':'Press to show more detail');exp.textContent=t(step.text);
  const hint=document.createElement('p');hint.className='reflex';hint.hidden=true;hint.textContent=t(step.hint);copy.append(number,exp,hint);
  const panel=document.createElement('button');panel.type='button';panel.className='inline-formula';panel.setAttribute('aria-label',`${l.replayAction} ${index+1}: ${t(step.operation)}`);
  const previous=index===0?exercise.original:exercise.steps[index-1].formula;
  panel.innerHTML=`<span class="formula-viewport"><span class="formula-frame formula-from" aria-hidden="true">${previous}</span><span class="formula-frame formula-to">${step.formula}</span></span>`;
  // Keep the formula itself readable to assistive technology, in addition to its replay action.
  panel.setAttribute('aria-describedby',`formula-${index}`);panel.querySelector('.formula-to').id=`formula-${index}`;
  row.append(copy,panel);root.append(row);addInteractions(exp,index);replayCleanups.push(EquationMotion.attach(panel));
 });
 document.getElementById('exerciseDomain').textContent=t(exercise.domain);
}
document.getElementById('enBtn').addEventListener('click',()=>{lang='en';render()});
document.getElementById('esBtn').addEventListener('click',()=>{lang='es';render()});
document.addEventListener('keydown',event=>{if(event.key==='Escape')document.getElementById('problemMenu').open=false});
document.addEventListener('click',event=>{const menu=document.getElementById('problemMenu');if(!menu.contains(event.target))menu.open=false});
window.addEventListener('popstate',readRoute);
readRoute();
</script>
